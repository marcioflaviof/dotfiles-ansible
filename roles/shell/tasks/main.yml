---
- name: Make fish the login shell
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ login_shell }}"
  become: true

- name: Clone the tmux plugin manager
  ansible.builtin.git:
    repo: "{{ tpm_repo }}"
    dest: "{{ tpm_path }}"
    version: master
    update: false

# fisher.fish is committed in the dotfiles repo, so on a linked machine this is
# already in place. force: false means the tracked copy is never overwritten,
# which would otherwise show up as an unwanted diff in the dotfiles repo.
# Skipped in check mode: ~/.config/fish is a symlink the dotfiles role only
# creates for real, so on a dry run the destination directory is not there yet.
- name: Install fisher
  when: not ansible_check_mode
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish
    dest: "{{ ansible_facts.env.HOME }}/.config/fish/functions/fisher.fish"
    mode: "0644"
    force: false

# fisher is a fish function, so it has to be invoked through fish itself. It
# reads .config/fish/fish_plugins and installs whatever is listed there.
#
# `fisher update` re-fetches and rewrites every plugin on each invocation, and
# ~/.config/fish is a symlink into the dotfiles checkout, so running it
# unconditionally would leave that repo dirty after every run. Compare what is
# asked for against what fisher already has, and only run when something is
# actually missing.
- name: Read the plugins fisher has installed
  ansible.builtin.command:
    cmd: "{{ login_shell }} -c 'fisher list'"
  register: fisher_list
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the plugin list fish_plugins asks for
  ansible.builtin.slurp:
    src: "{{ ansible_facts.env.HOME }}/.config/fish/fish_plugins"
  register: fish_plugins_file
  failed_when: false
  check_mode: false

- name: Install the plugins listed in fish_plugins
  ansible.builtin.command:
    cmd: "{{ login_shell }} -c 'fisher update'"
  vars:
    wanted: "{{ (fish_plugins_file.content | default('') | b64decode).split() }}"
    installed: "{{ fisher_list.stdout_lines | default([]) }}"
  when: wanted | difference(installed) | length > 0
  changed_when: true
  failed_when: false
